<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud IPA Signer Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #58a6ff; text-align: center; }
        label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #c9d1d9; box-sizing: border-box; font-size: 14px; }
        input[type="file"] { background-color: #161b22; border: 1px dashed #30363d; padding: 15px; cursor: pointer; text-align: center; }
        input:focus { border-color: #58a6ff; outline: none; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #238636; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2ea44f; }
        button:disabled { background-color: #30363d; color: #8b949e; cursor: not-allowed; }
        .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-size: 14px; word-break: break-word; }
        .success { background-color: rgba(56, 139, 60, 0.15); color: #56d364; border: 1px solid rgba(56, 139, 60, 0.4); }
        .error { background-color: rgba(248, 81, 73, 0.15); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud IPA Signer</h2>
    <form id="signerForm">
        <label for="ghToken">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required>
        
        <label for="appleId">Apple ID Email</label>
        <input type="email" id="appleId" placeholder="example@gmail.com" required>
        
        <label for="applePwd">Apple ID App-Specific Password</label>
        <input type="password" id="applePwd" placeholder="xxxx-xxxx-xxxx-xxxx" required>
        
        <label for="ipaFile">Select Unsigned .IPA File</label>
        <input type="file" id="ipaFile" accept=".ipa" required>
        
        <button type="submit" id="submitBtn">Sign Selected IPA File</button>
    </form>
    
    <div id="statusBox" class="status"></div>
</div>

<script>
    // Convert small to mid-sized binaries into text strings directly in Safari
    const mainFileToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });

    document.getElementById('signerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const token = document.getElementById('ghToken').value.trim();
        const email = document.getElementById('appleId').value.trim();
        const password = document.getElementById('applePwd').value.trim();
        const fileInput = document.getElementById('ipaFile').files[0];
        const statusBox = document.getElementById('statusBox');
        const submitBtn = document.getElementById('submitBtn');
        
        statusBox.style.display = 'block';
        statusBox.className = 'status';
        statusBox.style.backgroundColor = 'rgba(110, 118, 129, 0.1)';
        statusBox.style.color = '#8b949e';
        statusBox.innerText = 'Reading file and converting payload blocks...';
        submitBtn.disabled = true;

        if (!fileInput) {
            statusBox.className = 'status error';
            statusBox.innerText = 'Error: Please pick a local file first.';
            submitBtn.disabled = false;
            return;
        }

        try {
            // Encode the picked file
            const base64Data = await mainFileToBase64(fileInput);
            statusBox.innerText = 'Transmitting credentials and encrypted file to GitHub...';

            // Automatic Repository Configuration Coordinates
            const OWNER = "creator-dev-beep";
            const REPO = "saturn-ios3"; 
            const WORKFLOW_ID = "static.yml"; 

            const url = `https://github.com{OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        apple_id: email,
                        apple_password: password,
                        ipa_base64: base64Data,
                        file_name: fileInput.name
                    }
                })
            });

            if (response.status === 204) {
                statusBox.className = 'status success';
                statusBox.innerText = `Success! '${fileInput.name}' has been passed to the cloud workflow engine. Open your repository actions runner to check the compile status.`;
            } else {
                const errData = await response.json().catch(() => ({}));
                statusBox.className = 'status error';
                statusBox.innerText = `Error (${response.status}): ${errData.message || 'Workflow dispatch refused.'}`;
            }
        } catch (error) {
            statusBox.className = 'status error';
            statusBox.innerText = `Process Failure: ${error.message}`;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
