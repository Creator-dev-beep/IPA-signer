<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud IPA Signer Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #58a6ff; text-align: center; }
        label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #c9d1d9; box-sizing: border-box; font-size: 14px; }
        input[type="file"] { background-color: #161b22; border: 1px dashed #30363d; padding: 15px; cursor: pointer; text-align: center; }
        input:focus { border-color: #58a6ff; outline: none; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #238636; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2ea44f; }
        button:disabled { background-color: #30363d; color: #8b949e; cursor: not-allowed; }
        .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-size: 14px; word-break: break-word; }
        .success { background-color: rgba(56, 139, 60, 0.15); color: #56d364; border: 1px solid rgba(56, 139, 60, 0.4); }
        .error { background-color: rgba(248, 81, 73, 0.15); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud IPA Signer</h2>
    <form id="signerForm">
        <label for="ghToken">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required>
        
        <label for="appleId">Apple ID Email</label>
        <input type="email" id="appleId" placeholder="example@gmail.com" required>
        
        <label for="applePwd">Apple ID App-Specific Password</label>
        <input type="password" id="applePwd" placeholder="xxxx-xxxx-xxxx-xxxx" required>
        
        <label for="ipaFile">Select Unsigned .IPA File</label>
        <input type="file" id="ipaFile" accept=".ipa" required>
        
        <button type="submit" id="submitBtn">Sign Selected IPA File</button>
    </form>
    
    <div id="statusBox" class="status"></div>
</div>

<script>
    document.getElementById('signerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const token = document.getElementById('ghToken').value.trim();
        const email = document.getElementById('appleId').value.trim();
        const password = document.getElementById('applePwd').value.trim();
        const fileInput = document.getElementById('ipaFile').files[0];
        const statusBox = document.getElementById('statusBox');
        const submitBtn = document.getElementById('submitBtn');
        
        statusBox.style.display = 'block';
        statusBox.className = 'status';
        statusBox.style.backgroundColor = 'rgba(110, 118, 129, 0.1)';
        statusBox.style.color = '#8b949e';
        submitBtn.disabled = true;

        if (!fileInput) {
            statusBox.className = 'status error';
            statusBox.innerText = 'Error: Please pick a file first.';
            submitBtn.disabled = false;
            return;
        }

        const OWNER = "creator-dev-beep";
        const REPO = "IPA-signer"; 
        const WORKFLOW_ID = "static.yml"; 

        try {
            statusBox.innerText = "Slicing file data into small safe chunks...";
            
            // Read file streaming data dynamically to prevent RAM overflow crashes
            const fileReader = new FileReader();
            fileReader.readAsArrayBuffer(fileInput);
            
            fileReader.onload = async function() {
                const arrayBuffer = fileReader.result;
                // Convert bytes to clean base64 chunks
                let binary = "";
                const bytes = new Uint8Array(arrayBuffer);
                const len = bytes.byteLength;
                
                statusBox.innerText = "Processing streaming encoding steps...";
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64Content = btoa(binary);

                statusBox.innerText = "Uploading raw binary chunks safely to GitHub workspace...";
                
                // Directly write the file into your repo using GitHub's file contents API
                const targetFilePath = `unsigned_payload.ipa`;
                const uploadUrl = `https://github.com{OWNER}/${REPO}/contents/${targetFilePath}`;
                
                // Check if file already exists to get its SHA hash string (needed for overwrites)
                let currentSha = null;
                const checkRes = await fetch(uploadUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (checkRes.status === 200) {
                    const checkData = await checkRes.json();
                    currentSha = checkData.sha;
                }

                const putBody = {
                    message: `Web interface chunk upload: ${fileInput.name}`,
                    content: base64Content,
                    branch: "main"
                };
                if (currentSha) putBody.sha = currentSha;

                const filePutResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                });

                if (!filePutResponse.ok) {
                    throw new Error("Failed to store file chunk blocks in repository repository backend.");
                }

                statusBox.innerText = "File upload complete! Activating the automated cloud signer...";

                // Trigger your background compilation workflow
                const dispatchUrl = `https://github.com{OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`;
                const dispatchResponse = await fetch(dispatchUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            apple_id: email,
                            apple_password: password,
                            file_name: "unsigned_payload.ipa"
                        }
                    })
                });

                if (dispatchResponse.status === 204) {
                    statusBox.className = 'status success';
                    statusBox.innerText = `Success! File successfully streamed and signer activated in the cloud. Check your repository Actions tab to watch the processing build steps!`;
                } else {
                    throw new Error("Could not send dispatch signals to automated runner.");
                }
            };

        } catch (error) {
            statusBox.className = 'status error';
            statusBox.innerText = `Error: ${error.message}`;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
