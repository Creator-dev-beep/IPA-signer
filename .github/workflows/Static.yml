name: Generate Provisioning Files

on:
  workflow_dispatch:
    inputs:
      apple_id:
        required: true
      apple_password:
        required: true

jobs:
  generate_assets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Files
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Launch Dedicated Self-Hosted Anisette Container
      run: |
        echo "[DOCKER-INIT] Booting isolated network engine layer..."
        # Launching the official stable omnisette-server release via local Docker mapping
        docker run -d \
          --name standalone-anisette \
          -p 6969:80 \
          --restart always \
          --volume anisette_data:/opt/omnisette-server/lib \
          ghcr.io/sidestore/omnisette-server:latest

        echo "[SYSTEM] Allowing container layers to compile and sync profiles..."
        # Give the Docker background layer 10 seconds to fully mount internal modules and initialize the socket loop
        sleep 10
        
        echo "[SYSTEM] Checking local container network status:"
        docker ps
        curl -s http://127.0.0 || echo "Warning: Socket binding delayed."

    - name: Install Python Communication Libraries
      run: pip install requests

    - name: Execute Handshake Generation Script
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APPLE_PASSWORD: ${{ github.event.inputs.apple_password }}
      run: |
        python3 generate.py

    - name: Upload Profile Package Bundle as Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Signing-Credentials
        path: |
          ios_development_cert.p12
          ios_application_profile.mobileprovision
