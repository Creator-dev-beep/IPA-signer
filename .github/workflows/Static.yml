name: Generate Provisioning Files

on:
  workflow_dispatch:
    inputs:
      apple_id:
        required: true
      apple_password:
        required: true

jobs:
  generate_assets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Files
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Communication Libraries
      run: pip install requests

    - name: Run Certificate Generation Script
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APPLE_PASSWORD: ${{ github.event.inputs.apple_password }}
      run: |
        python3 generate.py

    - name: Upload Profile Package Bundle as Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Signing-Credentials
        path: |
          ios_development_cert.p12
          ios_application_profile.mobileprovision
