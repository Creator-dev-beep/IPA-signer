name: Generate Provisioning Files

on:
  workflow_dispatch:
    inputs:
      apple_id:
        required: true
      apple_password:
        required: true

jobs:
  compile_and_generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Workspace Files
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fetch and Unpack Apple Music Core Components
      run: |
        # Download the stable production apk payload to pull library segments
        curl -L "https://mzstatic.com" -o applemusic.apk
        unzip -o applemusic.apk 'lib/*/libstoreservicescore.so' 'lib/*/libCoreADI.so' -d .
        rm applemusic.apk
        
        # Structure the target library directories path environment expected by the system runtime
        mkdir -p ./lib
        if [ -d "./lib/x86_64" ]; then cp ./lib/x86_64/*.so ./lib/; fi
        if [ -d "./lib/armeabi-v7a" ]; then cp ./lib/armeabi-v7a/*.so ./lib/; fi

    - name: Install Python Package Dependencies
      run: pip install requests

    - name: Execute Handshake Generation Script
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APPLE_PASSWORD: ${{ github.event.inputs.apple_password }}
      run: |
        # Execute the dynamic local sweep script
        python3 generate.py

    - name: Upload Profile Package Bundle as Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Signing-Credentials
        path: |
          ios_development_cert.p12
          ios_application_profile.mobileprovision
